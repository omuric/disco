[package]
name = "disco"
version = "0.1.4"
edition = "2024"
authors = ["omu <omurice11@gmail.com>"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
chrono = "0.4"
dirs = "7.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart"] }
