name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: release x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools zip cmake
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Package and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/disco" README.md LICENSE dist/
          ARCHIVE="disco_${RELEASE_TAG#v}_${TARGET}.zip"
          (cd dist && zip "../$ARCHIVE" disco README.md LICENSE)
          gh release upload "$RELEASE_TAG" "$ARCHIVE"
